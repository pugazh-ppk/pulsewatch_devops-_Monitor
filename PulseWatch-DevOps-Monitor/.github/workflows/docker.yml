
name: PulseWatch Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t pulsewatch-monitor:latest \
            ./PulseWatch-DevOps-Monitor

